<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Супердок – БГ Иншурънс</title><style>body{font:16px system-ui;background:#f3f7fa;color:#17354a;max-width:1050px;margin:auto;padding:24px}h1{color:#007eae}button,input{font:inherit;padding:10px;border:1px solid #b9d1d9;border-radius:8px}button{cursor:pointer;background:#fff;color:#007eae}button.active{background:#008b72;color:white}input{width:95%;margin:12px 0}article{background:white;border:1px solid #dce7eb;border-radius:12px;padding:18px;margin:12px 0}small{color:#526a75}p{white-space:pre-wrap;line-height:1.5}nav{display:flex;gap:6px;flex-wrap:wrap}</style><h1>Супердок – БГ Иншурънс</h1><p>Служебни шаблони • Проверете конкретния договор преди употреба.</p><input id="q" placeholder="Търси по повод, категория или текст"><nav id="filters"></nav><div id="list"></div><script>const data=[{"category": "Аджибадем", "title": "Без абонаментно обслужване", "body": "Отказваме прегледа безкасово, тъй като съгласно договора нямате право на абонаментно обслужване в лечебното заведение. Молим да заплатите прегледа и да предявите претенция към застрахователя.", "note": ""}, {"category": "Аджибадем", "title": "Без абонамент – средни цени", "body": "Съгласно Вашия договор нямате право на абонаментно обслужване в лечебното заведение. Моля, заплатете и предявете иск за сумата, като имате предвид средните цени по договора.", "note": ""}, {"category": "Аджибадем", "title": "Категории A и J", "body": "Имате право на специалисти от категории A и J. Възможно е да се наложи доплащане при прегледа, като доплащането е за Ваша сметка.", "note": "Само при съответното ограничение в специалните условия. За друга категория се покрива до цената на категория A; разликата не се възстановява. Ако цялата група Аджибадем е включена без ограничение, не се прилага ограничението A/J."}, {"category": "Здравна карта", "title": "Актуален номер", "body": "Молим да въведете актуален номер на здравна карта.", "note": ""}, {"category": "Здравна карта", "title": "Повторно грешен номер", "body": "Моля, въвеждайте коректната карта – ХХХХХ. При пореден грешен номер прегледът няма да бъде одобрен.", "note": "Заменете ХХХХХ с коректния номер само в предназначената за клиента система."}, {"category": "Здравна карта", "title": "Непълен номер", "body": "Моля, представете пълния номер на Вашата здравноосигурителна карта. Не е намерено застраховано лице с предоставения номер.", "note": ""}, {"category": "Оплаквания", "title": "Липсваща информация", "body": "Въз основа на предоставената информация застрахователят не може да одобри прегледа на абонаментен принцип. Моля, опишете Вашите оплаквания за повода на прегледа или заплатете и предявете претенция за възстановяване на разходи.", "note": ""}, {"category": "Оплаквания", "title": "Възможен непокрит риск – средни цени", "body": "Възможно е прегледът да касае непокрит риск съгласно Общите условия. Моля, извършете плащането и подайте иск за възстановяване на разхода, като имате предвид, че към договора са приложени средни цени.", "note": ""}, {"category": "Оплаквания", "title": "Потвърждение при посочени оплаквания", "body": "Необходимо е посочените оплаквания да бъдат описани в медицинския документ.", "note": "При потвърждение съгласно условията на договора."}, {"category": "Хабилитирани", "title": "Хабилитиран специалист", "body": "Преглед при хабилитиран специалист не може да бъде ползван на абонаментен принцип. Ползва се само на принципа на възстановяване на разходи. Можете да заплатите и подадете претенция за възстановяване на разходи.", "note": ""}, {"category": "Хабилитирани", "title": "Хабилитиран специалист – средни цени", "body": "Преглед при хабилитиран специалист не може да бъде ползван на абонаментен принцип. Ползва се само на принципа на възстановяване на разходи. Можете да заплатите и подадете претенция за възстановяване на разходи, като имате предвид, че към договора са приложени средни цени.", "note": ""}, {"category": "Договор и лимити", "title": "Неактивен договор", "body": "Към датата на прегледа нямате активен договор.", "note": ""}, {"category": "Договор и лимити", "title": "Малък лимит ИБП", "body": "Моля, имайте предвид, че към момента лимитът Ви за ИБП е малък. Молим да заплатите прегледа си и да предявите претенция към застрахователя.", "note": ""}, {"category": "Изключения", "title": "Изключен риск", "body": "Застрахователят не може да одобри прегледа/услугата на абонаментен принцип. Въз основа на предоставената информация се касае за изключен риск съгласно Общите условия.", "note": "Посочени примери: спортна травма; т. 34 косопад, себорея, акне, витилиго, онихомикоза, розацея; т. 35 доброкачествени кожни образувания, липоми, атероми, фиброми, лезии, веруки, невуси, брадавици, кокоши трън. Възпален липом и бременност са посочени като непокрити по абонамент; проверете договора."}, {"category": "Изключения", "title": "Кокоши трън", "body": "Застрахователят не може да одобри прегледа на абонаментен принцип – изключен риск (кокоши трън). Прегледът не се отказва, само безкасовото плащане.", "note": ""}, {"category": "Изключения", "title": "Профилактика", "body": "Профилактичните прегледи не се покриват съгласно Общите условия на застраховката.", "note": ""}, {"category": "Изследвания", "title": "Ехография на коремни органи", "body": "Провеждането на ехография на коремни органи се извършва само след насочване от специалист гастроентеролог или хирург. Без наличието на съответното медицинско назначение изследването не може да бъде осъществено.", "note": "За самостоятелно записан час, не за ехография по време на преглед."}, {"category": "Физиотерапия", "title": "Необходимо назначение", "body": "За провеждане на физиотерапевтични процедури е необходимо назначение от специалист (ортопед, невролог, хирург или друг). Молим да изпратите амбулаторен лист с назначение на имейл адрес: claims.health@bulgariainsurance.bg.", "note": ""}, {"category": "Изследвания", "title": "КТ / ЯМР", "body": "Съгласно условията на Вашия здравноосигурителен договор, за извършване на високоспециализирани изследвания е необходимо предварително писмено съгласуване. Молим да изпратите амбулаторния лист на имейл адрес: claims.health@bulgariainsurance.bg за одобрение.", "note": ""}, {"category": "Изследвания", "title": "Предварително съгласуване", "body": "Съгласно условията на Вашия договор, за извършване на изследвания е необходимо предварително писмено съгласуване. Молим да изпратите амбулаторния лист на имейл адрес: claims.health@bulgariainsurance.bg.", "note": ""}, {"category": "Договор и лимити", "title": "Лекар без договор", "body": "Нямаме договор с избрания от Вас лекар. Моля, заплатете и предявете иск за сумата.", "note": ""}, {"category": "Изследвания", "title": "Мамолог – образна диагностика", "body": "За извършване на преглед при мамолог – образна диагностика, е необходимо предварително съгласуване. Моля, изпратете амбулаторния лист с препоръка за мамография на: claims.health@bulgariainsurance.bg.", "note": ""}, {"category": "Болнична помощ", "title": "Надграждане на НЗОК", "body": "Съгласно Общите условия на застрахователния Ви договор, по пакет болнична медицинска помощ ние надграждаме НЗОК. Това означава, че възстановяваме разходи само за стоки и услуги, които не се заплащат от НЗОК по съответната клинична пътека.", "note": "Примери от предоставения текст: избор на екип, скъпоструващи консумативи, незаплащани от НЗОК, потребителска такса."}, {"category": "Дентална медицина", "title": "Без абонамент", "body": "Всички прегледи, свързани с дентална медицина, не се покриват по абонамент. Молим да заплатите стойността на прегледа и впоследствие да подадете иск за възстановяване на сумата.", "note": ""}];let active='Всички';const $=id=>document.getElementById(id);function node(t,v){let e=document.createElement(t);e.textContent=v;return e}function render(){let q=$('q').value.toLowerCase();$('filters').replaceChildren();for(let c of ['Всички',...new Set(data.map(x=>x.category))]){let b=node('button',c+' ('+data.filter(x=>c==='Всички'||x.category===c).length+')');b.className=c===active?'active':'';b.onclick=()=>{active=c;render()};$('filters').append(b)}$('list').replaceChildren();for(let x of data.filter(x=>(active==='Всички'||x.category===active)&&Object.values(x).join(' ').toLowerCase().includes(q))){let a=node('article',''),b=node('button','Копирай');b.onclick=async()=>{try{await navigator.clipboard.writeText(x.body);b.textContent='Копирано'}catch(e){let t=node('textarea','');t.value=x.body;a.append(t);t.select();b.textContent='Копирайте с Ctrl+C'}};a.append(node('small',x.category),node('h2',x.title),node('p',x.body),b);if(x.note)a.append(node('p','Указание: '+x.note));$('list').append(a)}}$('q').oninput=render;render();</script></html>
