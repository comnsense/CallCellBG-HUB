<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Алианц Здраве</title><style>body{font:16px system-ui;background:#f3f7fa;color:#17354a;max-width:1050px;margin:auto;padding:24px}h1{color:#007eae}button,input{font:inherit;padding:10px;border:1px solid #b9d1d9;border-radius:8px}button{cursor:pointer;background:#fff;color:#007eae}button.active{background:#008b72;color:white}input{width:95%;margin:12px 0}article{background:white;border:1px solid #dce7eb;border-radius:12px;padding:18px;margin:12px 0}small{color:#526a75}p{white-space:pre-wrap;line-height:1.5}nav{display:flex;gap:6px;flex-wrap:wrap}.hub-copyright{background:transparent;color:#536b7d;display:flex;justify-content:center;align-items:center;gap:9px;padding:28px 16px;font:500 16px Arial,sans-serif;margin-top:0}.hub-copyright .copyright-symbol{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#79a63d;color:#fff;font-size:13px;font-weight:700}</style><h1>Алианц Здраве</h1><p>Оперативен справочник • Проверете конкретния договор и актуалните инструкции.</p><input id="q" placeholder="Търси по повод, категория или текст"><nav id="filters"></nav><div id="list"></div><div class="hub-copyright"><span class="copyright-symbol" aria-label="Copyright">C</span><span>comnsense 2022-2026</span></div><script>const data=[{"category": "Раждане", "title": "Фиксирана сума", "body": "Обяснявате, че е фиксирана сума. Проверявате код 002.008 / 002.008.002.", "note": ""}, {"category": "Прегледи", "title": "Планов преглед", "body": "Предавате към claimshealth@allianz.bg – те се обаждат до 1 работен ден.", "note": ""}, {"category": "Документи", "title": "Амбулаторен лист и плащане", "body": "Амбулаторен лист (МЗ №119/98) или епикриза с назначена терапия / предписание. Фактура + касов бон на името на застрахованото лице.", "note": ""}, {"category": "Изследвания", "title": "Документи за изследвания", "body": "Амбулаторен лист / направление (МЗ №119/98) с назначени изследвания. Резултати с подпис и печат на лекар/ЛЗ. Фактура + касов бон на името на застрахованото лице.", "note": ""}, {"category": "Изследвания", "title": "Образна и друга диагностика", "body": "Разчитане на образна диагностика (рентген, ЯМР, КТ, ехография) и ендоскопски и други изследвания (гастроскопия, колоноскопия, ЕЕГ, ЕМГ, доплер, сцинтиграфия) с подпис и печат.", "note": "В предоставения текст резултатите и разчитанията са посочени и за изследвания извън клинична пътека."}, {"category": "Изследвания", "title": "Назначени изследвания", "body": "Клиентът да изпрати амбулаторния лист на claimshealth@allianz.bg или в платформата.", "note": ""}, {"category": "Очила и лещи", "title": "Документи", "body": "Офталмологичен преглед + рецепта + фактура. При закупуване на очила – стикери/баркодове на стъклата.", "note": ""}, {"category": "Дентална помощ", "title": "Документи", "body": "Амбулаторен лист с пълен зъбен статус, извършени дейности, подпис/печат на лекар и подпис на пациента. Фактура + касов бон на името на застрахованото лице.", "note": "Зъбен статус при първо посещение."}, {"category": "Дентална помощ", "title": "Рентгенография", "body": "Рентгенография при хирургични услуги. Секторна рентгенография преди и след лечение на пулпит и периодонтит.", "note": "Не се изисква за деца до 18 г. и бременни жени."}, {"category": "Болнична помощ", "title": "Планова хоспитализация", "body": "Регистрира се събитието, предоставя се ИНУ. Съобщава се, че услугите се ползват на принципа на възстановяване на средства. В следващия работен ден ще се свържат за уточняване на детайли и предоставяне на формуляр „Искане за болнично лечение“. Подава се информация към claimshealth@allianz.bg.", "note": ""}, {"category": "Болнична помощ", "title": "Спешна хоспитализация", "body": "Регистрира се събитието, предоставя се ИНУ (ако няма такъв). Съобщава се, че в следващия работен ден ще се свържат за уточняване. Дават се указания да се изискат документи от болницата (ако се наложи заплащане). Подава се информация към claimshealth@allianz.bg.", "note": ""}, {"category": "Болнична помощ", "title": "Документи", "body": "Епикриза; заявление за избор на лекар/екип; стикери/баркодове на консумативи и импланти при оперативно лечение; фактура + касов бон.", "note": "Списъкът е групиран от предоставения смесен текст; проверете приложимостта."}, {"category": "Физиотерапия", "title": "Необходими документи", "body": "Амбулаторен лист от специалист по профила на заболяването с диагноза, анамнеза, обективно състояние и препоръка за физиотерапия. Амбулаторен лист от специалист по физикална терапия и рехабилитация с назначен комплекс от процедури. Заключителен преглед и резултат от проведените процедури. Процедурен картон с назначени и проведени процедури и подписи на лекар, пациент и рехабилитатор. Фактура + касов бон.", "note": ""}, {"category": "Физиотерапия", "title": "Съгласуване от лечебно заведение", "body": "Операторът проверява лимита в модул ИБП (код 001.011) и потвърждава сумата. След това пуска съобщение в Teams с ЕГН и сума.", "note": "Само в одобрения служебен канал, не в публичния портал."}, {"category": "Детски случай", "title": "Насочване", "body": "Подава се информация към отдел „Ликвидация на щети – здравно застраховане“ на claimshealth@allianz.bg.", "note": "В изходния текст указанието е до заглавие „Детски случай“; точният обхват не е уточнен."}, {"category": "Лечебни заведения", "title": "МЦ Лора – Гоце Делчев", "body": "бул. Гоце Делчев 31, бл. 76 – общопрактикуващ лекар", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Лора – Позитано", "body": "ул. Позитано №10 – общопрактикуващ лекар", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Младост (ДКЦ 25)", "body": "Младост 3 – терапевт и педиатър", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Свети Пантелеймон", "body": "бул. Ал. Стамболийски 15 – събота/неделя 08–17 ч.; празници 09–15 ч.", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "ВМА – Спешен център", "body": "ул. Свети Георги Софийски №3 – спешна помощ, денонощно", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "ДКЦ Софиямед – Люлин", "body": "бул. Джавахарлал Неру №23 – педиатър, денонощно", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Детско здраве / Болница Здравето", "body": "ул. Маестро Кънев №4, Овча купел – педиатър, денонощно", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Раждане", "title": "Документи за фиксирана сума", "body": "Епикриза + Заявление за обезщетение (винаги, дори при онлайн подаване, защото е \nфиксирана сума).", "note": "Фрагментът е от смесена таблица; проверете приложимостта."}, {"category": "Болнична помощ", "title": "Предварително запитване – без информация за лимити", "body": "При въпроси от клиент, които иска да знае предварително какво би се покрило по \nзастраховката му във връзка в болнично лечение/престой, той трябва да бъде насочен да \nизпрати мейл на claimshealth@allianz.bg, \nкато прикачи документи какво предстои, да опише в кое болнично заведение ще бъде приет, \nсъобщаваме му, че след като получим документите ще изпратим отговор какво би могло да се \nпокрие в тази връзка. Не се дава никаква информация относно лимити и покрития по модул \n„болнична медицинска помощ“", "note": ""}, {"category": "Болнична помощ", "title": "Пълен комплект документи", "body": "Попълнена бланка претенция за щета – не се изисква при предявяване на претенция онлайн Не се дава никаква информация относно лимити и покрития по модул „болнична медицинска помощ“\nЕпикриза\nЗаявление за избор на лекарски екип/ лекар\nСтикери от консуматив, използван при операцията (ако е заплатен от застрахованото лице)\nПодробна фактура с касов бон, на името на застрахованото лице с отразени отделни цени на здравните услуги/ стоки\n* След проведено болнично лечение и предписана допълнителна терапия, заедно с описаните документи следва да приложите и рецепта.", "note": ""}, {"category": "Санаториално лечение", "title": "Документи", "body": "Епикриза от Специализирана болница за рехабилитация\nЕпикриза с препоръка за санаториално/рехабилитационно лечение\nФактура + Касов бон", "note": ""}, {"category": "Детски случай", "title": "Приоритетно насочване", "body": "Винаги първо предлагайте МЦ Младост (София), ДКЦ Софиямед - Люлин или МЦ Детско здраве, където има целодневни \nпедиатри.", "note": ""}, {"category": "Дентална помощ", "title": "Първа претенция и медицински документ", "body": "Възстановяване на разходи по пакет дентална медицина\nАмбулаторен лист или друг медицински документ, удостоверяващ извършен преглед от \nстоматолог, който трябва да съдържа номер, дата, печат, УИН на лекаря, имената на \nзастрахованото лице, съдържащ подробно описание на извършените дейности; информация \nза снет зъбен статус, назначени изследвания и терапия\n* В случай, че предявявате за първи път претенция за щета \nследва да приложите инофмрация за снет зъбен статус \nили панорамна снимка, направени преди лечението.", "note": ""}, {"category": "Физиотерапия", "title": "Договорни и недоговорни заведения", "body": "При проведени физиотерапевтични процедури\n1. При извършване на физиотерапия в договорни болнични заведения, \nСъгласуването е ЗАДЪЛЖИТЕЛНО, само от страна на лечебното заведение. (те се \nсвързват с Алианц). Клиентите имат лимити за процедурите, които можем да \nпроверим в модул „Извънболнична помощ“.\n2. В случаите, в които клиентът ще посещава заведение с което Алианц няма \nдоговор, е необходимо да си вземе всички платежни документи, виждат се: в \nсписък с изискуеми документи, свързани с Физиотерапия.\nАмбулаторен лист или друг медицински документ, \nудостоверяващ извършен преглед от специалист - \nортопрд, невролог или др.\nПроцедурен картон с отбелязани всички проведени \nпроцедури", "note": ""}, {"category": "Физиотерапия", "title": "Софиямед и останалите договорни заведения", "body": "3. При обаждания във връзка със съгласуване на физиотерапия от Софиямед \nпроцедурата е следната:\nПодробна фактура с касов бон, на името на застрахованото \nлице с отразени отделни цени на здравните услуги/ стоки\nОт заведението се обажда специалист- физиотерапевт с предписани процедури, \nобща сума и ги съгласува по телефона с оператор.\nНие потвърждаваме дали ще се покрие или не като сума. \nСправката се прави в модул ИБП ( извънболнична медицинска помощ)- След това задължително се пуска съобщение в Тиймс с ЕГН \nна клиента и сумата, който са обявили от Софиямед.\n001.011Физиотерапевтични процедури съгласно съответния медицински стандарт – по медицински показания \nЗа останалите договорни заведения остава задължението от \nтяхна страна да съгласуват по мейл с Алианц назначените \nпроцедури.\n(като се гледа лимита за абонаментно плащане) .", "note": "ЕГН се изпраща само в одобрения служебен канал."}, {"category": "Самоучастие", "title": "20% – пример", "body": "Групова медицинска застраховка Алианц Здраве\nСъгласно Общите условия самоучастието е в размер на 20% от стойността на \nзакупените стоки или услуги. Например, ако фактурата е на стойност 100 лв., при \nсамоучастие ние ще ти възстановим 80 лв.", "note": "Проверете конкретния договор."}, {"category": "Източник", "title": "Пълен предоставен текст – Алианц", "body": "я Амбулаторен лист с назначение + Процедурен картон + Фактура\n💊 6. ЗДРАВНИ СТОКИ (лекарства, очила, помощни средства)\nЕпикриза + Заявление за обезщетение (винаги, дори при онлайн подаване, защото е \nфиксирана сума).\nКЛИНИКО-ЛАБОРАТОРНИ ИЗСЛЕДВАНИЯ, ОБРАЗНА ДИАГНОСТИКА\nБОЛНИЧНО ЛЕЧЕНИЕ\n  Болнично лечение (модул \"Болнична помощ\")\nС назначени/проведени процедури + подписи (лекар, пациент, \nрехабилитатор).\nСАНАТОРИАЛНО ЛЕЧЕНИЕ И РЕХАБИЛИТАЦИЯ\nФИЗИОТЕРАПИЯ И РЕХАБИЛИТАЦИЯ\n🦷ДЕНТАЛНА МЕДИЦИНА\nЕпикриза от Специализирана болница за рехабилитация\nЕпикриза с препоръка за санаториално/рехабилитационно лечение\nФактура + Касов бон\nВинаги първо предлагайте МЦ Младост (София), ДКЦ Софиямед - Люлин или МЦ Детско здраве, където има целодневни \nпедиатри.\nсъобщаваме му, че след като получим документите ще изпратим отговор какво би могло да се покрие в тази връзка. \nПопълнена бланка претенция за щета – не се изисква при предявяване на претенция онлайн Не се дава никаква информация относно лимити и покрития по модул „болнична медицинска помощ“\nЕпикриза\nЗаявление за избор на лекарски екип/ лекар\nСтикери от консуматив, използван при операцията (ако е заплатен от застрахованото лице)\nПодробна фактура с касов бон, на името на застрахованото лице с отразени отделни цени на здравните услуги/ стоки\n* След проведено болнично лечение и предписана допълнителна терапия, заедно с описаните документи следва да приложите и рецепта.\nВъзстановяване на разходи за предписани очила за корекция на зрението или коригиращи лещи\nПри въпроси от клиент, които иска да знае предварително какво би се покрило по \nзастраховката му във връзка в болнично лечение/престой, той трябва да бъде насочен да \nизпрати мейл на claimshealth@allianz.bg, \nкато прикачи документи какво предстои, да опише в кое болнично заведение ще бъде приет, \nсъобщаваме му, че след като получим документите ще изпратим отговор какво би могло да се \nпокрие в тази връзка. Не се дава никаква информация относно лимити и покрития по модул \n„болнична медицинска помощ“\n Възстановяване на разходи по пакет дентална медицина\nАмбулаторен лист или друг медицински документ, удостоверяващ извършен преглед от \nстоматолог, който трябва да съдържа номер, дата, печат, УИН на лекаря, имената на \nзастрахованото лице, съдържащ подробно описание на извършените дейности; информация \nза снет зъбен статус, назначени изследвания и терапия\n* В случай, че предявявате за първи път претенция за щета \nследва да приложите инофмрация за снет зъбен статус \nили панорамна снимка, направени преди лечението.\nПри проведени физиотерапевтични процедури\n1. При извършване на физиотерапия в договорни болнични заведения, \nСъгласуването е ЗАДЪЛЖИТЕЛНО, само от страна на лечебното заведение. (те се \nсвързват с Алианц). Клиентите имат лимити за процедурите, които можем да \nпроверим в модул „Извънболнична помощ“.\n2. В случаите, в които клиентът ще посещава заведение с което Алианц няма \nдоговор, е необходимо да си вземе всички платежни документи, виждат се: в \nсписък с изискуеми документи, свързани с Физиотерапия.\nАмбулаторен лист или друг медицински документ, \nудостоверяващ извършен преглед от специалист - \nортопрд, невролог или др.\nПроцедурен картон с отбелязани всички проведени \nпроцедури\n3. При обаждания във връзка със съгласуване на физиотерапия от Софиямед \nпроцедурата е следната:\nПодробна фактура с касов бон, на името на застрахованото \nлице с отразени отделни цени на здравните услуги/ стоки\nОт заведението се обажда специалист- физиотерапевт с предписани процедури, \nобща сума и ги съгласува по телефона с оператор.\nНие потвърждаваме дали ще се покрие или не като сума. \nСправката се прави в модул ИБП ( извънболнична медицинска помощ)- След това задължително се пуска съобщение в Тиймс с ЕГН \nна клиента и сумата, който са обявили от Софиямед.\n001.011Физиотерапевтични процедури съгласно съответния медицински стандарт – по медицински показания \nЗа останалите договорни заведения остава задължението от \nтяхна страна да съгласуват по мейл с Алианц назначените \nпроцедури.\n(като се гледа лимита за абонаментно плащане) . \nЗа останалите договорни заведения остава задължението от \nтяхна страна да съгласуват по мейл с Алианц назначените \nпроцедури.\nГрупова медицинска застраховка Алианц Здраве\nСъгласно Общите условия самоучастието е в размер на 20% от стойността на \nзакупените стоки или услуги. Например, ако фактурата е на стойност 100 лв., при \nсамоучастие ние ще ти възстановим 80 лв.", "note": "Смесени колони и фрагменти; не са самостоятелни потвърдени правила."}];let active='Всички';const $=id=>document.getElementById(id);function node(t,v){let e=document.createElement(t);e.textContent=v;return e}function render(){let q=$('q').value.toLowerCase();$('filters').replaceChildren();for(let c of ['Всички',...new Set(data.map(x=>x.category))]){let b=node('button',c+' ('+data.filter(x=>c==='Всички'||x.category===c).length+')');b.className=c===active?'active':'';b.onclick=()=>{active=c;render()};$('filters').append(b)}$('list').replaceChildren();for(let x of data.filter(x=>(active==='Всички'||x.category===active)&&Object.values(x).join(' ').toLowerCase().includes(q))){let a=node('article',''),b=node('button','Копирай');b.onclick=async()=>{try{await navigator.clipboard.writeText(x.body);b.textContent='Копирано'}catch(e){let t=node('textarea','');t.value=x.body;a.append(t);t.select();b.textContent='Копирайте с Ctrl+C'}};a.append(node('small',x.category),node('h2',x.title),node('p',x.body),b);if(x.note)a.append(node('p','Указание: '+x.note));$('list').append(a)}}$('q').oninput=render;render();</script></html>
