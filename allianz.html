<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Алианц Здраве</title><style>body{font:16px system-ui;background:#f3f7fa;color:#17354a;max-width:1050px;margin:auto;padding:24px}h1{color:#007eae}button,input{font:inherit;padding:10px;border:1px solid #b9d1d9;border-radius:8px}button{cursor:pointer;background:#fff;color:#007eae}button.active{background:#008b72;color:white}input{width:95%;margin:12px 0}article{background:white;border:1px solid #dce7eb;border-radius:12px;padding:18px;margin:12px 0}small{color:#526a75}p{white-space:pre-wrap;line-height:1.5}nav{display:flex;gap:6px;flex-wrap:wrap}.hub-copyright{background:#080b10;color:#bfc0c3;display:flex;justify-content:center;align-items:center;gap:9px;padding:28px 16px;font:500 16px Arial,sans-serif;margin-top:0}.hub-copyright .copyright-symbol{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#79a63d;color:#080b10;font-size:13px;font-weight:700}</style><h1>Алианц Здраве</h1><p>Оперативен справочник • Проверете конкретния договор и актуалните инструкции.</p><input id="q" placeholder="Търси по повод, категория или текст"><nav id="filters"></nav><div id="list"></div><div class="hub-copyright"><span class="copyright-symbol" aria-label="Copyright">C</span><span>comnsense 2022-2026</span></div><script>const data=[{"category": "Раждане", "title": "Фиксирана сума", "body": "Обяснявате, че е фиксирана сума. Проверявате код 002.008 / 002.008.002.", "note": ""}, {"category": "Прегледи", "title": "Планов преглед", "body": "Предавате към claimshealth@allianz.bg – те се обаждат до 1 работен ден.", "note": ""}, {"category": "Документи", "title": "Амбулаторен лист и плащане", "body": "Амбулаторен лист (МЗ №119/98) или епикриза с назначена терапия / предписание. Фактура + касов бон на името на застрахованото лице.", "note": ""}, {"category": "Изследвания", "title": "Документи за изследвания", "body": "Амбулаторен лист / направление (МЗ №119/98) с назначени изследвания. Резултати с подпис и печат на лекар/ЛЗ. Фактура + касов бон на името на застрахованото лице.", "note": ""}, {"category": "Изследвания", "title": "Образна и друга диагностика", "body": "Разчитане на образна диагностика (рентген, ЯМР, КТ, ехография) и ендоскопски и други изследвания (гастроскопия, колоноскопия, ЕЕГ, ЕМГ, доплер, сцинтиграфия) с подпис и печат.", "note": "В предоставения текст резултатите и разчитанията са посочени и за изследвания извън клинична пътека."}, {"category": "Изследвания", "title": "Назначени изследвания", "body": "Клиентът да изпрати амбулаторния лист на claimshealth@allianz.bg или в платформата.", "note": ""}, {"category": "Очила и лещи", "title": "Документи", "body": "Офталмологичен преглед + рецепта + фактура. При закупуване на очила – стикери/баркодове на стъклата.", "note": ""}, {"category": "Дентална помощ", "title": "Документи", "body": "Амбулаторен лист с пълен зъбен статус, извършени дейности, подпис/печат на лекар и подпис на пациента. Фактура + касов бон на името на застрахованото лице.", "note": "Зъбен статус при първо посещение."}, {"category": "Дентална помощ", "title": "Рентгенография", "body": "Рентгенография при хирургични услуги. Секторна рентгенография преди и след лечение на пулпит и периодонтит.", "note": "Не се изисква за деца до 18 г. и бременни жени."}, {"category": "Болнична помощ", "title": "Планова хоспитализация", "body": "Регистрира се събитието, предоставя се ИНУ. Съобщава се, че услугите се ползват на принципа на възстановяване на средства. В следващия работен ден ще се свържат за уточняване на детайли и предоставяне на формуляр „Искане за болнично лечение“. Подава се информация към claimshealth@allianz.bg.", "note": ""}, {"category": "Болнична помощ", "title": "Спешна хоспитализация", "body": "Регистрира се събитието, предоставя се ИНУ (ако няма такъв). Съобщава се, че в следващия работен ден ще се свържат за уточняване. Дават се указания да се изискат документи от болницата (ако се наложи заплащане). Подава се информация към claimshealth@allianz.bg.", "note": ""}, {"category": "Болнична помощ", "title": "Документи", "body": "Епикриза; заявление за избор на лекар/екип; стикери/баркодове на консумативи и импланти при оперативно лечение; фактура + касов бон.", "note": "Списъкът е групиран от предоставения смесен текст; проверете приложимостта."}, {"category": "Физиотерапия", "title": "Необходими документи", "body": "Амбулаторен лист от специалист по профила на заболяването с диагноза, анамнеза, обективно състояние и препоръка за физиотерапия. Амбулаторен лист от специалист по физикална терапия и рехабилитация с назначен комплекс от процедури. Заключителен преглед и резултат от проведените процедури. Процедурен картон с назначени и проведени процедури и подписи на лекар, пациент и рехабилитатор. Фактура + касов бон.", "note": ""}, {"category": "Физиотерапия", "title": "Съгласуване от лечебно заведение", "body": "Операторът проверява лимита в модул ИБП (код 001.011) и потвърждава сумата. След това пуска съобщение в Teams с ЕГН и сума.", "note": "Само в одобрения служебен канал, не в публичния портал."}, {"category": "Детски случай", "title": "Насочване", "body": "Подава се информация към отдел „Ликвидация на щети – здравно застраховане“ на claimshealth@allianz.bg.", "note": "В изходния текст указанието е до заглавие „Детски случай“; точният обхват не е уточнен."}, {"category": "Лечебни заведения", "title": "МЦ Лора – Гоце Делчев", "body": "бул. Гоце Делчев 31, бл. 76 – общопрактикуващ лекар", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Лора – Позитано", "body": "ул. Позитано №10 – общопрактикуващ лекар", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Младост (ДКЦ 25)", "body": "Младост 3 – терапевт и педиатър", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Свети Пантелеймон", "body": "бул. Ал. Стамболийски 15 – събота/неделя 08–17 ч.; празници 09–15 ч.", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "ВМА – Спешен център", "body": "ул. Свети Георги Софийски №3 – спешна помощ, денонощно", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "ДКЦ Софиямед – Люлин", "body": "бул. Джавахарлал Неру №23 – педиатър, денонощно", "note": "Данни от предоставената справка; работното време не е независимо проверено."}, {"category": "Лечебни заведения", "title": "МЦ Детско здраве / Болница Здравето", "body": "ул. Маестро Кънев №4, Овча купел – педиатър, денонощно", "note": "Данни от предоставената справка; работното време не е независимо проверено."}];let active='Всички';const $=id=>document.getElementById(id);function node(t,v){let e=document.createElement(t);e.textContent=v;return e}function render(){let q=$('q').value.toLowerCase();$('filters').replaceChildren();for(let c of ['Всички',...new Set(data.map(x=>x.category))]){let b=node('button',c+' ('+data.filter(x=>c==='Всички'||x.category===c).length+')');b.className=c===active?'active':'';b.onclick=()=>{active=c;render()};$('filters').append(b)}$('list').replaceChildren();for(let x of data.filter(x=>(active==='Всички'||x.category===active)&&Object.values(x).join(' ').toLowerCase().includes(q))){let a=node('article',''),b=node('button','Копирай');b.onclick=async()=>{try{await navigator.clipboard.writeText(x.body);b.textContent='Копирано'}catch(e){let t=node('textarea','');t.value=x.body;a.append(t);t.select();b.textContent='Копирайте с Ctrl+C'}};a.append(node('small',x.category),node('h2',x.title),node('p',x.body),b);if(x.note)a.append(node('p','Указание: '+x.note));$('list').append(a)}}$('q').oninput=render;render();</script></html>
