<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БГ Иншурънс – Здраве</title><style>body{font:16px system-ui;background:#f3f7fa;color:#17354a;max-width:1050px;margin:auto;padding:24px}h1{color:#007eae}button,input{font:inherit;padding:10px;border:1px solid #b9d1d9;border-radius:8px}button{cursor:pointer;background:#fff;color:#007eae}button.active{background:#008b72;color:white}input{width:95%;margin:12px 0}article{background:white;border:1px solid #dce7eb;border-radius:12px;padding:18px;margin:12px 0}small{color:#526a75}p{white-space:pre-wrap;line-height:1.5}nav{display:flex;gap:6px;flex-wrap:wrap}.hub-copyright{background:transparent;color:#536b7d;display:flex;justify-content:center;align-items:center;gap:9px;padding:28px 16px;font:500 16px Arial,sans-serif;margin-top:0}.hub-copyright .copyright-symbol{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#79a63d;color:#fff;font-size:13px;font-weight:700}</style><h1>БГ Иншурънс – Здраве</h1><p>Оперативен справочник • Проверете конкретния договор и актуалните инструкции.</p><input id="q" placeholder="Търси по повод, категория или текст"><nav id="filters"></nav><div id="list"></div><div class="hub-copyright"><span class="copyright-symbol" aria-label="Copyright">C</span><span>comnsense 2022-2026</span></div><script>const data=[{"category": "Претенции", "title": "Подаване и бланка", "body": "Медицинска застраховка БГ ЗДРАВЕ\nБланка по образец https://www.bulgariainsurance.bg/uploaded/files/9-Interaktivna-Pretencia-Bulgaria-ZdraveBG.pdf\nclaims.health@bulgariinsurance.bg или на пощенския адрес\nОУ, Глава VII, Необходими документи при кандидатстване за възстановяване на разходи \n61. Към претенцията се прилагат всички документи, доказващи основанието и размера й, като в зависимост от естеството на събитието те са:", "note": "Имейлът е изписан както в източника; проверете адреса преди изпращане."}, {"category": "Документи", "title": "(1) За медицински прегледи:", "body": "амбулаторен лист или друг официален медицински документ за извършен преглед, съдържащ  диагноза, анамнеза, обективно състояние и отразени назначения за изследвания и лечение,дата на издаване,подпис и печат на лекаря и на лечебното заведение, \nфактура на името на застрахованото лице с описани отделно позиции, фискален бон;", "note": ""}, {"category": "Документи", "title": "(2) За медицински изследвания:", "body": "амбулаторен лист или друг официален медицински документ за извършен преглед, съдържащ диагноза, анамнеза, обект. състояние и назначения за изследвания и лечение,дата на издаване,подпис и печат на лекаря и на лечебното заведение, резултати от \nпроведените изследвания, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон;", "note": ""}, {"category": "Документи", "title": "(3) За физиотерапия:", "body": "амбулаторен лист от преглед при лекар специалист, с което се предписва физиотерапия; амб. Лист от преглед при физиотерапевт, физиотерапевтична карта, фактура на името на Застрахованото лице с детайлно описание на вида, броя и цената на отделните \nфизиопроцедури, фискален бон.", "note": ""}, {"category": "Документи", "title": "(4) За наблюдение на бременност:", "body": "амбулаторен лист или друг официален медицински документ за извършен преглед с подпис и печат на лекаря или на лечебното заведение, резултати от проведени изследвания, фактура на името на Застрахованото лице, фискален бон.", "note": ""}, {"category": "Документи", "title": "(5) За болнично лечение:", "body": "епикриза за проведеното лечение с подпис и печат на лечебното заведение, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон, копие от Декларацията за Избор на екип, ако има заплатен такъв\nстикери от използвани консумативи и медицински изделия или друг официален документ, удостоверяващ влагането им, издаден от медицинското заведение, извършило оперативната интервенция, ако има заплатени такива", "note": ""}, {"category": "Документи", "title": "(6) За рехабилитация и санаториално лечение:", "body": "епикриза от проведено болнично лечение с подпис и печат на лекуващия лекар и печат на лечебното заведение с вписани препоръки за провеждане на рехабилитация или санаториално лечение, които са продължение на основното лечение,\nпроцедурен картон от проведените физиотерапевтични процедури, медицински документ, удостоверяващ извършената рехабилитация, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон;", "note": ""}, {"category": "Документи", "title": "(7) За раждане:", "body": "епикриза на Застрахованото лице с подпис на лекуващия лекар и печат на лечебното заведение, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон; копие от Декларацията за Избор на екип", "note": ""}, {"category": "Документи", "title": "(8) За услуги, свързани с битови и други допълнителни условия при предоставяне на медицинска помощ:", "body": "медицински документи, удостоверяващи необходимостта от услугата и нейното извършване, издадени от лекуващия лекар, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон.", "note": ""}, {"category": "Документи", "title": "(9) За лекарствени продукти и помощни средства:", "body": "амбулаторен лист или друг официален медицински документ за извършен преглед, рецепта с отразено количество и схема на лечение с подпис и печат и дата на издаване, фактура с фискален бон на името на застрахованото лице с описани поотделно позиции на \nзакупените лекарствени продукти. Лекарствени продукти,предписани на рецептурна бланка образец МЗ-НЗОК номер 5А с три отрязъка-А,В и С се представят амбулаторен лист и последното предписание в рецептурна книжка", "note": ""}, {"category": "Документи", "title": "(10) За диоптрични стъкла/лещи:", "body": "медицински документ от извършен преглед от лекар-офталмолог, осъществен в лечебно заведение и удостоверяващ промяна в зрението с повече от 0.5 диоптъра, \nрецепта, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон, копие от стикерите на опаковките на диоптричните стъкла.", "note": ""}, {"category": "Документи", "title": "(11) За стоматологогично лечение:", "body": "амбулаторен лист от стоматолог с отразен зъбен статус, диагноза и вид на извършените услуги,дата,подпис и печат с подробно описание на извършените дейности, фактура на името на застрахованото лице (с описани отделно позиции), фискален бон; секторна \nрентгенова снимка след Кореново лечение – за пулпит, периодонтит и хирургични услуги. \nзадължително е при завеждане на първа претенция за стоматолог да има отразен зъбен статус на клиента", "note": ""}, {"category": "Документи", "title": "(12) Лекарства за хронично болни, частично реимбурсирани от НЗОК", "body": "Възстановява се сумата, която представлява разликата между цената на лекарствените средства и частта, реимбурсирана от НЗОК.копие от първа и последна страница на Рецептурната си книжка,амбулаторния лист от прегледа, рецепта (ако е ел. Рецепта – без нея), \nфактура и касов бон в оригинал.", "note": ""}, {"category": "Документи", "title": "(13) МЕДИЦИНСКО ЗА: работа, брак, категория МПС и каквото и да е в покритието на Клиента", "body": "копие на медицинското, фактура, касов бон", "note": ""}, {"category": "Срокове", "title": "Общи условия – чл. 62, 64, 65", "body": "62. Застрахователят е длъжен да възстанови на Застрахования разходите за здравни стоки и услуги в срок до 15 (петнадесет) работни дни от датата на постъпване на Претенцията за изплащане на застрахователно обезщетение и всички необходими документи за \nопределяне на основанието и размера й. \n64. Разходите по набавянето на необходимите документи не се възстановяват от Застрахователя и са за сметка на Застрахования. \n65. За определяне на основателността на претенцията, Застрахователят има право да изисква допълнителни медицински и финансови документи.", "note": ""}, {"category": "Срокове", "title": "Стандартни срокове и преразглеждане", "body": "Срок за преразглеждане по основание 1 месец\nСрок за преразглеждане по размер 7 календарни дни\nСрок за разглеждане стандартен по закон 15 работни дни\nСрок за закупуване на лекарства стандартен 7 календарни дни\nСрок за закупуване на очила стандартен 30 календарни дни", "note": ""}, {"category": "Срокове", "title": "Индивидуални срокове – оригинална справка", "body": "7 работни дни\n7 календарни дни\n7 календарни дни\n7 календарни дни\nЕкспириън 10 работни дни\n10 работни дни\n10 работни дни\n10 работни дни\nИЗИ 7 работни дни\nПетрол 10 работни дни\nСрок за закупуване на лекарства стандартен 7 календарни дни\nВеликобританско посолство 7 календарни дни\nЕкспириън 10 работни дни\n10 календарни дни\nСрок за закупуване на очила стандартен 30 календарни дни\nНокиа 90 календарни дни", "note": "Част от редовете нямат работодател или ясно заглавие; не прилагайте без проверка."}];let active='Всички';const $=id=>document.getElementById(id);function node(t,v){let e=document.createElement(t);e.textContent=v;return e}function render(){let q=$('q').value.toLowerCase();$('filters').replaceChildren();for(let c of ['Всички',...new Set(data.map(x=>x.category))]){let b=node('button',c+' ('+data.filter(x=>c==='Всички'||x.category===c).length+')');b.className=c===active?'active':'';b.onclick=()=>{active=c;render()};$('filters').append(b)}$('list').replaceChildren();for(let x of data.filter(x=>(active==='Всички'||x.category===active)&&Object.values(x).join(' ').toLowerCase().includes(q))){let a=node('article',''),b=node('button','Копирай');b.onclick=async()=>{try{await navigator.clipboard.writeText(x.body);b.textContent='Копирано'}catch(e){let t=node('textarea','');t.value=x.body;a.append(t);t.select();b.textContent='Копирайте с Ctrl+C'}};a.append(node('small',x.category),node('h2',x.title),node('p',x.body),b);if(x.note)a.append(node('p','Указание: '+x.note));$('list').append(a)}}$('q').
